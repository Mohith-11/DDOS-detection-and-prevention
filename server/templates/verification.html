{% extends "base.html" %}
{% block content %}

<style>
/* Verification Queue Table – Same UI as Dashboard Table */

.table {
  width: 100%;
  background: rgba(20, 30, 50, 0.45);
  backdrop-filter: blur(10px);
  border-collapse: separate;
  border-spacing: 0 6px;
  color: #e0e0e0;
}

.table thead th {
  background: linear-gradient(135deg, rgba(0, 212, 255, 0.18), rgba(0, 150, 200, 0.12));
  color: var(--primary-color);
  border-bottom: 1px solid var(--border-color);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.75rem;
  letter-spacing: 1px;
  padding: 12px;
}

.table tbody tr {
  background: rgba(17, 25, 40, 0.55);
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: 10px;
  transition: all 0.25s ease;
  cursor: pointer;
}

.table tbody tr:hover {
  background: rgba(0, 212, 255, 0.07);
  border-left: 3px solid var(--primary-color);
  transform: translateX(3px);
}

.table tbody td {
  padding: 10px 14px;
  border: none;
  vertical-align: middle;
  font-size: 0.85rem;
  color: #dbeafe;
}

.table tbody tr td:first-child {
  border-top-left-radius: 10px;
  border-bottom-left-radius: 10px;
}

.table tbody tr td:last-child {
  border-top-right-radius: 10px;
  border-bottom-right-radius: 10px;
}

.table.table-sm tr,
.table.table-sm td,
.table.table-sm th {
  background-color: transparent !important;
}

/* Buttons */
.btn-secondary {
  background: rgba(100, 150, 200, 0.2);
  border: 1px solid rgba(0, 212, 255, 0.25);
  color: #dbeafe;
  transition: 0.2s;
}

.btn-secondary:hover {
  background: rgba(100, 150, 200, 0.35);
  border-color: var(--primary-color);
}

.btn-danger {
  background: rgba(255, 51, 102, 0.2);
  border: 1px solid rgba(255, 51, 102, 0.4);
  color: #ff7b9c;
  transition: 0.2s;
}

.btn-danger:hover {
  background: rgba(255, 51, 102, 0.35);
  border-color: var(--danger-color);
}
</style>

<h3 class="mb-4" style="color: var(--primary-color); letter-spacing:1px;">Verification Queue</h3>

<table class="table table-sm">
  <thead>
    <tr>
      <th>ID</th>
      <th>Time</th>
      <th>Agent</th>
      <th>Src</th>
      <th>Dst</th>
      <th>Prob</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="verify-body">
    {% for a in alerts %}
      <tr id="row-{{ a.id }}" class="verify-row">
        <td>{{ a.id }}</td>
        <td>{{ a.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
        <td>{{ a.agent_id }}</td>
        <td>{{ a.src_ip }}</td>
        <td>{{ a.dst_ip }}</td>
        <td>{{ '%.3f'|format(a.probability) }}</td>
        <td>
          <button 
              class="btn btn-sm btn-secondary verify-btn"
              data-id="{{ a.id }}"
              data-action="discard">
              Discard
          </button>

          <button 
              class="btn btn-sm btn-danger verify-btn"
              data-id="{{ a.id }}"
              data-action="block">
              Block
          </button>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<script>
/* KEEP OLD FUNCTIONALITY SAME */
document.querySelectorAll(".verify-btn").forEach(btn => {
    btn.addEventListener("click", async (event) => {
        event.stopPropagation();  // Prevent triggering row click
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");

        const resp = await fetch("/api/verify", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ id, action })
        });

        if (resp.ok) {
            const row = document.getElementById("row-" + id);
            if (row) row.remove();
        } else {
            alert("Verification failed");
        }
    });
});

/* NEW FEATURE: CLICK ON ROW => OPEN PACKET DETAILS */
document.addEventListener("click", function (e) {
    const row = e.target.closest("tr.verify-row");
    if (!row) return;

    const id = row.children[0].innerText.trim();
    window.location.href = `/packet/${id}`;
});
</script>

{% endblock %}
