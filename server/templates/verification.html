{% extends "base.html" %}
{% block content %}

<h3>Verification Queue</h3>

<table class="table table-sm">
  <thead>
    <tr>
      <th>ID</th>
      <th>Time</th>
      <th>Agent</th>
      <th>Src</th>
      <th>Dst</th>
      <th>Prob</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody id="verify-body">
    {% for a in alerts %}
      <tr id="row-{{ a.id }}">
        <td>{{ a.id }}</td>
        <td>{{ a.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td>
        <td>{{ a.agent_id }}</td>
        <td>{{ a.src_ip }}</td>
        <td>{{ a.dst_ip }}</td>
        <td>{{ '%.3f'|format(a.probability) }}</td>
        <td>
          <button 
              class="btn btn-sm btn-success verify-btn"
              data-id="{{ a.id }}"
              data-action="verify_block">
              Verify & Block
          </button>

          <button 
              class="btn btn-sm btn-secondary verify-btn"
              data-id="{{ a.id }}"
              data-action="verify_ignore">
              Ignore
          </button>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<script>
document.querySelectorAll(".verify-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");

        const resp = await fetch("/api/verify", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ id, action })
        });

        if (resp.ok) {
            const row = document.getElementById("row-" + id);
            if (row) row.remove();
        } else {
            alert("Verification failed");
        }
    });
});
</script>

{% endblock %}
